server:
  # Respect the platform-injected PORT (Render, etc.); default 8080 locally.
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/api_gateway_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Simple, dependency-free schema management for this project. See README
      # "Database" section — swap for Flyway/Liquibase migrations in production.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Managed Redis (e.g. Upstash) requires auth + TLS; local Redis leaves these blank/false.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-change-me-this-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  password-reset:
    token-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}
    # Local/dev only: with no email service, return the reset link in the API
    # response so the flow is testable. Set to false in production and deliver
    # the link by email instead.
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:true}
  mail:
    # Resend API key (https://resend.com). Blank = email disabled (link only logged/returned).
    resend-api-key: ${RESEND_API_KEY:}
    # Must be an address on a domain you've verified in Resend. onboarding@resend.dev
    # works out of the box but only delivers to your own Resend account email.
    from: ${MAIL_FROM:GatewayPlatform <onboarding@resend.dev>}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@gateway.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    consumer-email: ${SEED_CONSUMER_EMAIL:consumer@gateway.local}
    consumer-password: ${SEED_CONSUMER_PASSWORD:Consumer123!}
  sample-api:
    backend-url: ${SAMPLE_API_URL:http://sample-api:8081/products}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.gateway.platform: INFO
